<form class="stack" method="post" action="/pronunciacion/limites">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="scope_id" value="{{ pronunciation_scope }}">
  <label class="usage-checkbox"><input type="checkbox" name="enabled" value="true"{% if pronunciation_policy.enabled %} checked{% endif %}> {{ 'Habilitar evaluación de pronunciación para la familia' if pronunciation_scope == 0 else 'Permitir pronunciación a este alumno' }}</label>
  <div class="form-grid"><label>Minutos al mes<input type="number" name="monthly_minutes" min="1" max="240" value="{{ pronunciation_policy.monthly_seconds // 60 }}" required></label>
  {% if pronunciation_scope %}<label>Intentos diarios<input type="number" name="daily_attempts" min="1" max="30" value="{{ pronunciation_policy.daily_attempts }}" required></label>{% else %}<input type="hidden" name="daily_attempts" value="10">{% endif %}</div>
  <button class="button button-secondary">Guardar pronunciación</button>
</form>
