name: Comprobaciones de Aula IA
on:
  push:
    branches: [main, develop, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias fijadas
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Probar límites y acceso
        run: python tests/security_regression.py
      - name: Probar proveedor de voz Azure sin llamadas reales
        run: python tests/azure_voice_regression.py
      - name: Probar consumo, atribución y presupuestos
        run: python tests/consumption_regression.py
      - name: Probar inglés, permisos, enseñanza y voces
        run: python tests/english_regression.py
      - name: Probar pronunciación, audio, cuotas y escucha dinámica
        run: python tests/pronunciation_regression.py
      - name: Probar listening, texto oculto, niveles y permisos
        run: python tests/listening_regression.py
      - name: Probar conversación, ruido y silencio
        run: node tests/conversation_controls.mjs
      - name: Auditar dependencias
        run: |
          python -m venv /tmp/aula-audit
          /tmp/aula-audit/bin/pip install pip-audit==2.10.1
          /tmp/aula-audit/bin/pip-audit --require-hashes -r requirements.lock
